global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Django app (django-prometheus, multiprocess across gunicorn workers).
  # Scraped directly on the internal network; nginx does not route /metrics.
  - job_name: 'careerbridge'
    metrics_path: '/metrics/'
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['careerbridge:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Postgres/Redis need exporters (postgres_exporter, redis_exporter) to be
  # scraped; their service ports do not speak the Prometheus format.
